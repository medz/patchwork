name: Performance Baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: Patchwork Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1.7.2
        with:
          sdk: stable

      - name: Install workspace dependencies
        run: dart pub get

      - name: Run performance baselines
        run: dart bench/patchwork.dart --json | tee patchwork-benchmarks.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: patchwork-benchmarks
          path: patchwork-benchmarks.json
