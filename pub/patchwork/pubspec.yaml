name: patchwork
version: 0.2.0
description: Patch management for Dart projects, starting with reviewable dependency patches for pub packages.
homepage: https://github.com/medz/patchwork
repository: https://github.com/medz/patchwork
issue_tracker: https://github.com/medz/patchwork/issues
documentation: https://github.com/medz/patchwork/tree/main/pub/patchwork#readme
funding:
  - https://github.com/sponsors/medz
topics:
  - cli
  - dependencies
  - patch
  - pub

executables:
  patchwork: patchwork

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  crypto: ^3.0.7
  path: ^1.9.1
  pub_semver: ^2.2.0
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
