name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test (Dart ${{ matrix.dart-sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dart-sdk:
          - 3.10.0
          - stable

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1.7.2
        with:
          sdk: ${{ matrix.dart-sdk }}

      - name: Install workspace dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze package
        working-directory: pub/patchwork
        run: dart analyze

      - name: Test package fast lane
        working-directory: pub/patchwork
        run: dart test --exclude-tags=full

      - name: Test package full workflow lane
        working-directory: pub/patchwork
        run: dart test --tags=full --concurrency=1

      - name: Check publish package
        working-directory: pub/patchwork
        run: dart pub publish --dry-run

      - name: Install example dependencies
        working-directory: examples/hello_patch/app
        run: dart pub get

      - name: Analyze example
        working-directory: examples/hello_patch/app
        run: dart analyze

      - name: Smoke example
        working-directory: examples/hello_patch/app
        run: dart run patchwork doctor && dart run bin/app.dart
