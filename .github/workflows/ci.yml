name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dart:
    name: Dart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1.7.2
        with:
          sdk: stable

      - name: Install workspace dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed pub/patchwork/bin pub/patchwork/lib pub/patchwork/test examples/hello_patch

      - name: Analyze package
        working-directory: pub/patchwork
        run: dart analyze

      - name: Test package
        working-directory: pub/patchwork
        run: dart test

      - name: Check publish package
        working-directory: pub/patchwork
        run: dart pub publish --dry-run
